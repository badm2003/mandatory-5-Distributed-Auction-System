syntax = "proto3"; 
import "google/protobuf/empty.proto";

option go_package = "./grpc";

package grpc;

service Registry {
    rpc Register(RegistrationRequest) returns (RegistrationReply);
}

service Election {
    rpc Election(google.protobuf.Empty) returns (Acknowledgement);
    rpc Elected(google.protobuf.Empty) returns (Acknowledgement);
    rpc Heartbeat(google.protobuf.Empty) returns (Acknowledgement);
}

service Auction {
    rpc Bid(BidRequest) returns (Acknowledgement);
    rpc Result(google.protobuf.Empty) returns (ResultReply);
}

service ReplicateService {
    rpc Replicate(AuctionState) returns (Acknowledgement);
    rpc Commit(CommitRequest) returns (google.protobuf.Empty);
}

message BidRequest {
    int64 amount = 1;
}

message Acknowledgement {
    string reply = 1;
}

message ResultReply {
    int64 outcome = 1;
}

message AuctionState {
    int64 seq = 1;
    int64 bid = 2;
}

message CommitRequest {
    int64 seq = 1;
}


// -----------------------------------------------------
// Election Serivce Messages
// -----------------------------------------------------

message ElectionRequest {
    repeated int32 ports = 1;
}

message ElectedRequest {
    int32 leaderPort = 1;
    repeated int32 ports = 2;
}

// -----------------------------------------------------
// Registry Service Messages
// -----------------------------------------------------

message RegistrationRequest {
    int32 port = 1;
}

message RegistrationReply {
    repeated int32 ports = 1;
}